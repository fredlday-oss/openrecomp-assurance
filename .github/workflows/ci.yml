name: assurance-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema pytest
      - name: Compile validation tools
        run: |
          python -m py_compile tools/validate_json.py
          python -m py_compile tools/public_safety_scan.py
      - name: Validate schema JSON syntax
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('schemas').glob('*.json'):
              json.loads(p.read_text())
              print('PASS', p)
          PY
      - name: Public safety gate
        run: python tools/public_safety_scan.py
      - name: Run tests
        run: pytest -q
